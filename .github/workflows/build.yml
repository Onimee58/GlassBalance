name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main, 'develop/v0.3.0', 'v0.3.0-*']
    tags: ['v*']

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-24.04
            label: Linux
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run core tests
        run: python -m unittest discover -s tests -v
      - name: Build native desktop bundle
        run: python scripts/build_bundle.py
      - name: Package portable bundle
        run: python scripts/package.py ${{ matrix.label }}
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $version = python scripts/release_info.py version
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" 'packaging\windows\GlassBalance.iss'
      - name: Build Ubuntu Debian package
        if: runner.os == 'Linux'
        run: python scripts/build_deb.py
      - name: Publish portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: GlassBalance-${{ matrix.label }}-Portable
          path: GlassBalance-${{ matrix.label }}.zip
          if-no-files-found: error
      - name: Publish Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: GlassBalance-Windows-Setup
          path: installer-out/*.exe
          if-no-files-found: error
      - name: Publish Ubuntu installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: GlassBalance-Ubuntu-DEB
          path: glassbalance_*.deb
          if-no-files-found: error

  macos:
    # EXPERIMENTAL through alpha/beta; a failure here must not block Windows/Linux.
    name: macOS (experimental)
    runs-on: macos-15   # macos-14 was retired by GitHub on 2026-11-02
    continue-on-error: true
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run core tests
        run: python -m unittest discover -s tests -v
      - name: Build .app and .dmg
        run: bash scripts/build_macos.sh
      - name: Publish macOS disk image
        uses: actions/upload-artifact@v4
        with:
          name: GlassBalance-macOS-DMG-experimental
          path: GlassBalance-*-macOS-*.dmg
          if-no-files-found: error

  release:
    # Runs after the builds. Creates a GitHub release when:
    #   - a tag vX.Y.Z or vX.Y.Z-beta.N is pushed (tag must equal glassbalance.__version__), or
    #   - main is pushed and the tag for its (stable) version does not exist yet.
    # Releases are created as DRAFTS by default so a human checks them before publishing.
    # Set repository variable RELEASE_DRAFT=false to publish immediately.
    name: GitHub release
    needs: [bundle, macos]
    if: always() && needs.bundle.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Decide whether to release
        id: info
        run: |
          VERSION="$(python3 scripts/release_info.py version)"
          TAG="v$VERSION"
          PRE="$(python3 scripts/release_info.py prerelease)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$TAG" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match glassbalance.__version__ ($VERSION). Fix the version or the tag."
              exit 1
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists; nothing to release for this push to main."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ "$PRE" == "true" ]]; then
            echo "::warning::main holds prerelease version $VERSION. Prereleases are released by pushing a tag, not by merging to main."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download build artifacts
        if: steps.info.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Name assets and write checksums
        if: steps.info.outputs.skip == 'false'
        run: |
          V="${{ steps.info.outputs.version }}"
          mkdir release-assets
          mv artifacts/GlassBalance-Windows.zip "release-assets/GlassBalance-v$V-Windows-x64-Portable.zip"
          mv artifacts/GlassBalance-Linux.zip   "release-assets/GlassBalance-v$V-Linux-x64-Portable.zip"
          mv artifacts/GlassBalance-Setup-*.exe release-assets/
          # GitHub rewrites '~' in asset names; dpkg reads the version from the package itself.
          mv artifacts/glassbalance_*_amd64.deb "release-assets/glassbalance_${V}_amd64.deb"
          if compgen -G "artifacts/GlassBalance-*-macOS-*.dmg" > /dev/null; then
            mv artifacts/GlassBalance-*-macOS-*.dmg release-assets/
          else
            echo "::warning::macOS build missing; releasing without a .dmg."
            echo "NO_MAC=1" >> "$GITHUB_ENV"
          fi
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          ls -l release-assets
          python3 scripts/release_info.py notes release-notes.md
          if [[ -n "${NO_MAC:-}" ]]; then printf '\n> The experimental macOS build failed for this release.\n' >> release-notes.md; fi
          if compgen -G "release-assets/*.dmg" > /dev/null; then
            printf '\n### macOS (experimental)\nApple Silicon only. Not notarized: on first launch, open System Settings → Privacy & Security and choose **Open Anyway**.\n' >> release-notes.md
          fi
      - name: Create GitHub release
        if: steps.info.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GlassBalance ${{ steps.info.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ steps.info.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.info.outputs.prerelease == 'true' && 'false' || 'true' }}
          draft: ${{ vars.RELEASE_DRAFT != 'false' }}
          files: release-assets/*
          fail_on_unmatched_files: true
