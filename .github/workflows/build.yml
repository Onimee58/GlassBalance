name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main, 'develop/v0.3.0', 'v0.3.0-*']
    tags: ['v*']

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-24.04
            label: Linux
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run core tests
        run: python -m unittest discover -s tests -v
      - name: Bundle lightweight maintainer avatar (optional)
        run: python scripts/fetch_avatar.py
      - name: Build native desktop bundle
        run: python scripts/build_bundle.py
      - name: Package portable bundle
        run: python scripts/package.py ${{ matrix.label }}
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'packaging\windows\GlassBalance.iss'
      - name: Build Ubuntu Debian package
        if: runner.os == 'Linux'
        run: python scripts/build_deb.py
      - name: Publish portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: GlassBalance-${{ matrix.label }}-Portable
          path: GlassBalance-${{ matrix.label }}.zip
          if-no-files-found: error
      - name: Publish Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: GlassBalance-Windows-Setup
          path: installer-out/*.exe
          if-no-files-found: error
      - name: Publish Ubuntu installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: GlassBalance-Ubuntu-DEB
          path: glassbalance_*.deb
          if-no-files-found: error
