name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'v0.2.0-*'
    tags:
      - 'v*'

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-24.04
            label: Linux
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run core tests
        run: python -m unittest discover -s tests -v
      - name: Bundle lightweight maintainer avatar (optional)
        run: python scripts/fetch_avatar.py
      - name: Ensure assets directory exists
        run: python -c "from pathlib import Path; Path('glassbalance/assets').mkdir(parents=True, exist_ok=True)"
      - name: Build native desktop bundle
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name GlassBalance --add-data "glassbalance/assets:glassbalance/assets" app.py
      - name: Package platform bundle
        run: python scripts/package.py ${{ matrix.label }}
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassBalance-${{ matrix.label }}
          path: GlassBalance-${{ matrix.label }}.zip
          if-no-files-found: error
